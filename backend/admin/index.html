<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WICXA Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F8F5F0; color: #0D0D0D; }
        .nav-header { background-color: #0D0D0D; color: #fff; }
    </style>
</head>
<body class="min-h-screen">

    <header class="nav-header px-8 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-widest">WICXA <span class="text-gray-500 font-normal">· ADMIN</span></h1>
        <div class="flex gap-4">
            <button class="bg-white text-black px-4 py-2 text-sm font-semibold rounded">Products</button>
            <button class="border border-gray-600 px-4 py-2 text-sm font-semibold rounded hover:bg-gray-800 transition">Orders</button>
        </div>
    </header>

    <main class="max-w-4xl mx-auto py-12 px-6">
        
        <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200 mb-8">
            <label class="block text-xs font-bold text-gray-500 tracking-wider mb-2 uppercase">Admin Key</label>
            <div class="flex gap-4">
                <input type="password" id="adminKey" class="flex-1 border border-gray-300 p-3 rounded outline-none focus:border-black transition" placeholder="Enter your secret admin key">
            </div>
            <p id="keyStatus" class="text-xs mt-2 text-gray-500">Required to authorize product uploads.</p>
        </div>

        <div class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">
            <h2 class="text-2xl font-bold mb-6">Add New Product</h2>
            
            <form id="productForm" class="space-y-6">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 tracking-wider mb-2 uppercase">Name *</label>
                        <input type="text" id="name" required class="w-full border border-gray-300 p-3 rounded outline-none focus:border-black transition" placeholder="e.g. BLURRED Drop Tee">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 tracking-wider mb-2 uppercase">Category *</label>
                        <select id="category" class="w-full border border-gray-300 p-3 rounded outline-none focus:border-black transition bg-white">
                            <option value="Men">Men</option>
                            <option value="Women">Women</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-gray-500 tracking-wider mb-2 uppercase">Price *</label>
                        <input type="text" id="price" required class="w-full border border-gray-300 p-3 rounded outline-none focus:border-black transition" placeholder="e.g. 800 BDT">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-gray-500 tracking-wider mb-2 uppercase">Active</label>
                        <select class="w-full border border-gray-300 p-3 rounded outline-none focus:border-black transition bg-white">
                            <option>Yes — visible on storefront</option>
                            <option>No — hidden</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 tracking-wider mb-2 uppercase">Description</label>
                    <textarea id="description" rows="4" class="w-full border border-gray-300 p-3 rounded outline-none focus:border-black transition" placeholder="Describe the product..."></textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-500 tracking-wider mb-2 uppercase">Image URLs (Comma separated) *</label>
                    <input type="text" id="imageUrls" required class="w-full border border-gray-300 p-3 rounded outline-none focus:border-black transition" placeholder="https://img.com/1.jpg, https://img.com/2.jpg">
                    <p class="text-xs text-gray-400 mt-2">Upload your images to ImgBB or Cloudinary and paste the direct URLs here.</p>
                </div>

                <div class="pt-4 border-t border-gray-100">
                    <button type="submit" id="submitBtn" class="bg-black text-white px-8 py-3 rounded font-semibold tracking-wide hover:bg-gray-800 transition w-full">
                        Publish Product
                    </button>
                </div>
                
                <div id="alertMessage" class="hidden p-4 rounded text-sm font-medium text-center"></div>
            </form>
        </div>
    </main>

    <script>
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertMessage');
            const adminKey = document.getElementById('adminKey').value;
            
            if (!adminKey) {
                alertBox.textContent = 'Please enter your Admin Key first.';
                alertBox.className = 'p-4 rounded text-sm font-medium text-center bg-red-100 text-red-700 block';
                return;
            }

            btn.textContent = 'Publishing...';
            btn.disabled = true;
            btn.classList.add('opacity-70');

            const rawImages = document.getElementById('imageUrls').value;
            const imagesArray = rawImages.split(',').map(url => url.trim()).filter(url => url.length > 0);

            const productData = {
                name: document.getElementById('name').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value.replace(' BDT', '').trim(),
                description: document.getElementById('description').value,
                images: imagesArray
            };

            try {
                // Since this page is hosted on the backend, we can just use the relative path /api/products
                const response = await fetch('/api/products', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-key': adminKey
                    },
                    body: JSON.stringify(productData)
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.textContent = 'Product successfully published to store!';
                    alertBox.className = 'p-4 rounded text-sm font-medium text-center bg-green-100 text-green-700 block';
                    document.getElementById('productForm').reset();
                } else {
                    alertBox.textContent = data.message || 'Failed to publish product.';
                    alertBox.className = 'p-4 rounded text-sm font-medium text-center bg-red-100 text-red-700 block';
                }
            } catch (err) {
                alertBox.textContent = 'Network error. Could not connect to server.';
                alertBox.className = 'p-4 rounded text-sm font-medium text-center bg-red-100 text-red-700 block';
            } finally {
                btn.textContent = 'Publish Product';
                btn.disabled = false;
                btn.classList.remove('opacity-70');
            }
        });
    </script>
</body>
</html>
